/**
 * stageMotion.js
 * Small helpers that play the book's movements with the Web Animations API. Unlike
 * per-frame JavaScript animation, transform and opacity animations run on the browser's
 * compositor, so they stay smooth even while the page is busy doing other work.
 * Every pose uses the same list of transform functions in the same order, so the browser
 * can blend between poses one number at a time.
 */

// ----------------------------------------------------------------- constants
const EASE_OUT = 'cubic-bezier(0.22, 0.85, 0.25, 1)';     // quick start, long soft landing (pull-out)
const EASE_IN_OUT = 'cubic-bezier(0.45, 0, 0.2, 1)';      // gentle both ends (put-back, cover close)
const EASE_OPEN = 'cubic-bezier(0.3, 0.7, 0.2, 1)';       // cover swing and recentering
const REDUCED_MOTION_MS = 1;                              // people who ask for less motion get instant changes

/**
 * Whether the viewer asked for reduced motion.
 * @returns {boolean} True when reduced motion is requested
 */
function prefersReducedMotion() {
  return typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/**
 * CSS transform text for a book pose. Always the same functions in the same order.
 * @param {{x: number, y: number, scale: number, rotateX: number, rotateY: number}} pose - Position (px), scale, turns (degrees)
 * @returns {string} transform value
 */
function poseTransform(pose) {
  return `translate3d(${pose.x}px, ${pose.y}px, 0px) scale(${pose.scale}) rotateX(${pose.rotateX}deg) rotateY(${pose.rotateY}deg)`;
}

/**
 * Stops a running animation on an element but keeps what is on screen right now.
 * @param {HTMLElement} element - Element that may be animating
 */
function settleMotion(element) {
  const running = element.__motion;
  if (!running) return;
  try { running.commitStyles(); } catch (error) { /* element not rendered: nothing to keep */ }
  running.cancel();
  element.__motion = null;
}

/**
 * Plays keyframes on an element, then writes the final values into its style.
 * A new call on the same element first settles the previous one, so interruptions are smooth.
 * @param {HTMLElement} element - Element to animate
 * @param {Object[]} frames - Keyframes; each may have transform, opacity, offset, easing
 * @param {{duration: number, easing?: string, delay?: number}} options - Timing in milliseconds
 * @returns {Promise<boolean>} Resolves true when it finished, false when something interrupted it
 */
function playMotion(element, frames, { duration, easing = EASE_OUT, delay = 0 }) {
  const last = frames[frames.length - 1];
  const applyFinal = () => {
    if (last.transform !== undefined) element.style.transform = last.transform;
    if (last.opacity !== undefined) element.style.opacity = String(last.opacity);
  };
  settleMotion(element);
  if (typeof element.animate !== 'function') { applyFinal(); return Promise.resolve(true); }   // very old browser: jump to the end
  const animation = element.animate(frames, { duration: prefersReducedMotion() ? REDUCED_MOTION_MS : duration, easing, delay, fill: 'both' });
  element.__motion = animation;
  return animation.finished.then(() => {
    applyFinal();                                          // keep the end state once the animation object is gone
    animation.cancel();
    if (element.__motion === animation) element.__motion = null;
    return true;
  }, () => false);                                         // cancelled by a newer motion
}

/**
 * Moves an element from where it is (or from a known pose) to a target.
 * @param {HTMLElement} element - Element to animate
 * @param {{transform?: string, opacity?: number}} to - End values
 * @param {{duration: number, easing?: string, delay?: number, from?: Object}} options - Timing, and a known start when the element is at rest
 * @returns {Promise<boolean>} Resolves true when it finished, false when interrupted
 */
function playMotionTo(element, to, { from, ...timing }) {
  const interrupted = !!element.__motion;
  settleMotion(element);
  const style = getComputedStyle(element);                // what is on screen right now
  const known = interrupted ? undefined : from;           // a given start is only trusted when the element was at rest
  const startFrame = {};
  for (const key of Object.keys(to)) {
    startFrame[key] = known && known[key] !== undefined ? known[key] : (key === 'opacity' ? Number(style.opacity) : style.transform);
  }
  return playMotion(element, [startFrame, to], timing);
}

/**
 * book3d.js
 * A book as a CSS 3D box: back cover, spine, page edges, and a front cover that swings
 * open on its spine side. Used by the stage (big, opens to pages) and by the reading
 * stand (small, closed). The parent supplies the sizing element and `preserve-3d`.
 */

// ----------------------------------------------------------------- constants
const PAGE_FONT_RATIO = 0.068;                            // page text size as a fraction of the book width

/**
 * The faces of one book.
 * @param {{book: Object, allBooks: Object[], today: string, W: number, H: number, D: number,
 *   hingeRef: Object, onCoverClick: function, withPages: boolean, coverExtras: *}} props
 *   W, H, D are width, height and thickness in px; spineUnit is px per spine design unit (omit to derive from H); withPages draws the printed pages
 *   (the stand does not need them); hingeRef receives the element that swings the cover (turn it with rotateY, 0 to -180 degrees); coverExtras is drawn on the front cover (e.g. a tap hint)
 * @returns {React.ReactElement} Fragment of positioned faces
 */
function BookBox({ book, allBooks, today, W, H, D, spineUnit, hingeRef, onCoverClick, withPages, coverExtras }) {
  const faceBox = { left: 0, top: 0, width: W, height: H };
  const pageFontSize = W * PAGE_FONT_RATIO;               // page text scales with the book
  return html`<${React.Fragment}>
    <div className="face page-edge" style=${{ ...faceBox, transform: `translateZ(${-D / 2}px) rotateY(180deg)`, background: '#2a1a10' }}>
      <${CoverArt} book=${book} width=${W} height=${H} /></div>
    <div className="face" style=${{ left: (W - D) / 2, top: 0, width: D, height: H, transform: `translateX(${-W / 2}px) rotateY(-90deg)` }}>
      <${SpineArt} book=${book} width=${D} height=${H} unit=${spineUnit || H / SL.SPINE_BASE_HEIGHT_PX} /></div>
    <div className="face page-edge" style=${{ left: (W - D) / 2, top: 0, width: D, height: H, transform: `translateX(${W / 2}px) rotateY(90deg)` }} />
    <div className="face page-edge h" style=${{ left: 0, top: (H - D) / 2, width: W, height: D, transform: `translateY(${-H / 2}px) rotateX(90deg)` }} />
    <div className="face page-edge h" style=${{ left: 0, top: (H - D) / 2, width: W, height: D, transform: `translateY(${H / 2}px) rotateX(-90deg)` }} />
    ${withPages && html`<div className="face" style=${{ ...faceBox, transform: `translateZ(${D / 2 - 1}px)`, fontSize: pageFontSize }}>
      <${StatsPage} book=${book} allBooks=${allBooks} today=${today} /></div>`}
    <div style=${{ ...faceBox, position: 'absolute', transformStyle: 'preserve-3d', transform: `translateZ(${D / 2}px)` }}>
      <div ref=${hingeRef} className="hinge">
        <div className="face cover-face" style=${faceBox} onClick=${onCoverClick} onPointerDown=${noteTapStart}>
          <${CoverArt} book=${book} width=${W} height=${H} /><div className="cover-sheen" /><div className="cover-crease" />${coverExtras}</div>
        ${withPages && html`<div className="face" style=${{ ...faceBox, transform: 'rotateY(180deg)', fontSize: pageFontSize }}><${SummaryPage} book=${book} /></div>`}
      </div>
    </div>
  <//>`;
}

/**
 * stand3d.js
 * The reading stand as real 3D geometry (CSS 3D, no flat drawing): the top of a Roman
 * column on a thick stepped base, with the book resting on a marble wedge. Round parts
 * are rings of flat facets (20 around, 16 for the fluted shaft); each facet is lit from
 * a fixed light direction, so the shading changes smoothly around the column.
 * Everything is positioned relative to the center of the abacus' top surface, with y
 * pointing down (negative y is above the abacus).
 */

// ----------------------------------------------------------------- constants
const LIGHT_DIR = (() => { const v = [-0.55, -0.65, 0.55]; const len = Math.hypot(...v); return v.map((c) => c / len); })();   // from upper left, toward the viewer
const AMBIENT_LIGHT = 0.28;                               // shade of a face turned fully away from the light
const MARBLE_LIGHT = [247, 244, 238];                     // marble in full light
const MARBLE_SHADOW = [104, 110, 128];                    // marble in shade (cool grey-blue)
const BRASS_LIGHT = [246, 222, 150];
const BRASS_SHADOW = [96, 68, 22];
const ROUND_FACETS = 20;                                  // facets around a smooth round part
const SHAFT_FACETS = 16;                                  // flutes around the column shaft
const VEIN_TILE_PX = 256;                                 // size of the repeating vein texture (drawn in texture.js)
const STAND_TILT_X_DEG = -17;                             // the camera looks down on the stand
const STAND_TURN_Y_DEG = 16;                              // and sees it from slightly to the left, so the book's spine shows
const STAND_SCALE = 0.88;
const BOOK_REST_Z = 62;                                   // front edge of the wedge, where the book's bottom edge sits
const BOOK_REST_DEG = 55;                                 // book leans back this far from vertical (35 degrees above flat)
const WEDGE_W = 132;
const WEDGE_DEPTH = 124;
const WEDGE_BACK_H = 86;
const FLOOR_Y = 234;                                      // bottom of the base, in stand coordinates

/**
 * How brightly a surface with the given outward normal is lit.
 * @param {number[]} normal - Unit vector [x, y, z]; y is negative for upward-facing
 * @returns {number} AMBIENT_LIGHT up to 1
 */
function lightAmount(normal) {
  const facing = normal[0] * LIGHT_DIR[0] + normal[1] * LIGHT_DIR[1] + normal[2] * LIGHT_DIR[2];   // dot product
  return AMBIENT_LIGHT + (1 - AMBIENT_LIGHT) * Math.max(0, facing);
}

/**
 * CSS color for a lit surface.
 * @param {string} tint - 'marble' or 'brass'
 * @param {number} amount - 0 (shade) to 1 (full light)
 * @returns {string} rgb() color
 */
function surfaceColor(tint, amount) {
  const [dark, light] = tint === 'brass' ? [BRASS_SHADOW, BRASS_LIGHT] : [MARBLE_SHADOW, MARBLE_LIGHT];
  const mixed = dark.map((channel, i) => Math.round(channel + (light[i] - channel) * amount));
  return `rgb(${mixed[0]}, ${mixed[1]}, ${mixed[2]})`;
}

/**
 * Background for a flat face: base color plus marble veins offset per face so veins do not repeat.
 * @param {string} tint - 'marble' or 'brass'
 * @param {number} amount - Light on this face, 0 to 1
 * @param {number} seed - Different per face, shifts the vein texture
 * @param {number} y - Face height, continues veins from face to face
 * @returns {Object} Style properties
 */
function flatPaint(tint, amount, seed, y) {
  const color = surfaceColor(tint, amount);
  if (tint === 'brass') return { backgroundColor: color, backgroundImage: 'linear-gradient(90deg, rgba(255,255,255,.28), rgba(0,0,0,.2))' };
  return { backgroundColor: color, backgroundImage: 'var(--vein)', backgroundSize: `${VEIN_TILE_PX}px ${VEIN_TILE_PX}px`, backgroundPosition: `${-seed * 37}px ${-y}px` };
}

/**
 * A rectangular block (four sides and a top).
 * @param {{w: number, h: number, d: number, y: number, tint?: string, z?: number}} props - Size, top height, tint and z offset of its center
 * @returns {React.ReactElement} Faces
 */
function Box3D({ w, h, d, y, tint = 'marble', z = 0 }) {
  const faces = [
    { id: 'front', fw: w, fh: h, top: y, t: `translateZ(${d / 2 + z}px)`, n: [0, 0, 1] },
    { id: 'right', fw: d, fh: h, top: y, t: `translateZ(${z}px) rotateY(90deg) translateZ(${w / 2}px)`, n: [1, 0, 0] },
    { id: 'left', fw: d, fh: h, top: y, t: `translateZ(${z}px) rotateY(-90deg) translateZ(${w / 2}px)`, n: [-1, 0, 0] },
    { id: 'top', fw: w, fh: d, top: y - d / 2, t: `translateZ(${z}px) rotateX(90deg)`, n: [0, -1, 0] },
  ];
  return html`<${React.Fragment}>${faces.map((f, i) => html`<div key=${f.id} className="f3 f3-edge" style=${{ left: -f.fw / 2, top: f.top, width: f.fw, height: f.fh,
    transform: f.t, ...flatPaint(tint, lightAmount(f.n), i + h, y) }} />`)}<//>`;
}

/**
 * A round part (cylinder or cone frustum) built from flat facets.
 * @param {{rTop: number, rBottom: number, h: number, y: number, facets?: number, fluted?: boolean, tint?: string}} props
 *   radii at the top and bottom, height, y of the top, facet count, flutes, tint
 * @returns {React.ReactElement} Facets
 */
function Frustum3D({ rTop, rBottom, h, y, facets = ROUND_FACETS, fluted = false, tint = 'marble', veins: withVeins = true }) {
  const half = Math.PI / facets;
  const slant = Math.hypot(h, rBottom - rTop);
  const tilt = Math.atan2(rBottom - rTop, h);             // positive when the part is narrower at the top
  const wTop = 2 * rTop * Math.sin(half);
  const wBottom = 2 * rBottom * Math.sin(half);
  const wMax = Math.max(wTop, wBottom);
  const apothem = ((rTop + rBottom) / 2) * Math.cos(half);   // distance from the axis to the middle of a facet
  const topInset = (wMax - wTop) / 2;
  const bottomInset = (wMax - wBottom) / 2;
  const clip = `polygon(${topInset}px 0, calc(100% - ${topInset}px) 0, calc(100% - ${bottomInset}px) 100%, ${bottomInset}px 100%)`;
  const lightAt = (degrees) => {
    const a = (degrees * Math.PI) / 180;
    return lightAmount([Math.sin(a) * Math.cos(tilt), -Math.sin(tilt), Math.cos(a) * Math.cos(tilt)]);
  };
  return html`<${React.Fragment}>${Array.from({ length: facets }, (_, i) => {
    const theta = (i * 360) / facets;                      // 0 faces the viewer; positive turns toward +x
    const left = lightAt(theta - 180 / facets);            // light at this facet's left and right edges
    const right = lightAt(theta + 180 / facets);
    const mid = lightAt(theta);
    const colorOf = (amount) => surfaceColor(tint, amount);
    const gradient = fluted
      ? `linear-gradient(90deg, ${colorOf(left * 0.62)} 0%, ${colorOf(mid * 1.02)} 30%, ${colorOf(mid)} 62%, ${colorOf(right * 0.7)} 100%)`   // each flute is a shallow groove
      : `linear-gradient(90deg, ${colorOf(left)}, ${colorOf(right)})`;
    const veins = tint === 'brass' || !withVeins ? '' : 'var(--vein), ';   // small rings skip the texture: it is invisible at that size and costs paint time
    const layered = veins !== '';
    return html`<div key=${i} className="f3" style=${{ left: -wMax / 2, top: y + h / 2 - slant / 2, width: wMax, height: slant,
      transform: `rotateY(${theta}deg) translateZ(${apothem}px) rotateX(${(tilt * 180) / Math.PI}deg)`, clipPath: clip, WebkitClipPath: clip,
      backgroundImage: veins + gradient, backgroundSize: layered ? `${VEIN_TILE_PX}px ${VEIN_TILE_PX}px, 100% 100%` : '100% 100%', backgroundRepeat: layered ? 'repeat, no-repeat' : 'no-repeat',
      backgroundPosition: layered ? `${-i * 41}px ${-y}px, 0 0` : '0 0' }} />`;
  })}<//>`;
}

/**
 * A flat round surface facing up (the top of a ring you can see from above).
 * @param {{r: number, y: number, tint?: string}} props - Radius, height, tint
 * @returns {React.ReactElement} Disc
 */
function Disc3D({ r, y, tint = 'marble' }) {
  return html`<div className="f3" style=${{ left: -r, top: y - r, width: 2 * r, height: 2 * r, borderRadius: '50%', transform: 'rotateX(90deg)',
    ...flatPaint(tint, lightAmount([0, -1, 0]), 7, y) }} />`;
}

/**
 * A wedge (triangular block) that slopes up toward the back, holding the book at a reading angle.
 * @returns {React.ReactElement} Faces
 */
function Wedge3D() {
  const slopeLen = Math.hypot(WEDGE_DEPTH, WEDGE_BACK_H);
  const zBack = BOOK_REST_Z - WEDGE_DEPTH;                // z of the wedge's back wall
  const zMid = (BOOK_REST_Z + zBack) / 2;
  const sideTop = -WEDGE_BACK_H;
  const slopeNormal = [0, -Math.cos(Math.atan2(WEDGE_BACK_H, WEDGE_DEPTH)), Math.sin(Math.atan2(WEDGE_BACK_H, WEDGE_DEPTH))];
  const sideClip = { right: 'polygon(0 100%, 100% 100%, 100% 0)', left: 'polygon(0 0, 0 100%, 100% 100%)' };
  const side = (key, rotation, normal) => html`<div key=${key} className="f3 f3-edge" style=${{ left: -WEDGE_DEPTH / 2, top: sideTop, width: WEDGE_DEPTH, height: WEDGE_BACK_H,
    transform: `translateZ(${zMid}px) rotateY(${rotation}deg) translateZ(${WEDGE_W / 2}px)`, clipPath: sideClip[key], WebkitClipPath: sideClip[key], ...flatPaint('marble', lightAmount(normal), 3, 0) }} />`;
  return html`<${React.Fragment}>
    <div className="f3 f3-edge" style=${{ left: -WEDGE_W / 2, top: sideTop, width: WEDGE_W, height: WEDGE_BACK_H, transform: `translateZ(${zBack}px) rotateY(180deg)`, ...flatPaint('marble', AMBIENT_LIGHT, 5, 0) }} />
    <div className="f3 f3-edge" style=${{ left: -WEDGE_W / 2, top: -WEDGE_BACK_H / 2 - slopeLen / 2, width: WEDGE_W, height: slopeLen,
      transform: `translateZ(${zMid}px) rotateX(${BOOK_REST_DEG}deg)`, ...flatPaint('marble', lightAmount(slopeNormal), 9, 0) }} />
    ${side('right', 90, [1, 0, 0])}${side('left', -90, [-1, 0, 0])}
  <//>`;
}

/**
 * The whole stand with the book resting on it. The book is a real 3D book so tapping it
 * can hand over to the stage with the same shape.
 * Memoized so picking the book does not redraw its ~190 facets (the book is hidden by toggling a class).
 * @param {{book: (Object|null), W: number, H: number, D: number, onBookClick: function}} props
 *   W, H, D are the book's width, height and thickness
 * @returns {React.ReactElement} Stand scene content (position it inside a perspective container)
 */
const MarbleStand = memo(function MarbleStand({ book, W, H, D, onBookClick }) {
  return html`<div className="stand3d" style=${{ transform: `rotateX(${STAND_TILT_X_DEG}deg) rotateY(${STAND_TURN_Y_DEG}deg) scale(${STAND_SCALE})` }}>
    <div className="floor-shadow" style=${{ top: FLOOR_Y - 170, transform: 'rotateX(90deg)' }} />
    <${Box3D} w=${196} h=${16} d=${196} y=${218} /><${Box3D} w=${172} h=${34} d=${172} y=${184} />
    <${Disc3D} r=${60} y=${176} /><${Frustum3D} rTop=${58} rBottom=${60} h=${8} y=${176} veins=${false} />
    <${Disc3D} r=${54} y=${170} /><${Frustum3D} rTop=${52} rBottom=${56} h=${6} y=${170} veins=${false} />
    <${Frustum3D} rTop=${42} rBottom=${49} h=${126} y=${44} facets=${SHAFT_FACETS} fluted=${true} />
    <${Frustum3D} rTop=${47} rBottom=${47} h=${3} y=${41} tint="brass" /><${Frustum3D} rTop=${45} rBottom=${45} h=${3} y=${38} tint="brass" />
    <${Frustum3D} rTop=${62} rBottom=${46} h=${22} y=${16} veins=${false} />
    <${Box3D} w=${146} h=${6} d=${146} y=${10} /><${Box3D} w=${158} h=${10} d=${158} y=${0} />
    <${Wedge3D} />
    <${Box3D} w=${W + 14} h=${5} d=${6} y=${-5} z=${BOOK_REST_Z - 3} tint="brass" />
    ${book && html`<div className="rest-book" data-book-id=${book.id} style=${{ left: -W / 2, top: -H, width: W, height: H,
      transform: `translateZ(${BOOK_REST_Z}px) rotateX(${BOOK_REST_DEG}deg) translateZ(${D / 2}px)` }}>
      <${BookBox} book=${book} W=${W} H=${H} D=${D} withPages=${false}
        onCoverClick=${onBookClick} coverExtras=${html`<span className="tap-ring" />`} />
    </div>`}
  </div>`;});

/**
 * readingRoom.js
 * The start screen: the book you are reading, resting on a carved marble column capital
 * (built in 3D in stand3d.js). Tapping the book lifts it onto the stage.
 */

// ----------------------------------------------------------------- constants
const READING_BOOK_W = 112;                               // size of the book on the stand, in frame px
const READING_BOOK_H = 168;
const READING_BOOK_D = 26;                                // thickness on the stand (a typical novel)
const STAND_TOP_Y = 218;                                  // where the abacus' top surface sits inside the scene

/**
 * The reading screen.
 * Memoized: picking the book does not redraw the stand.
 * @param {{room: Object, onPickReading: function, today: string}} props
 *   room.book is the current book or null; onPickReading(book, element) opens the book;
 *   today is YYYY-MM-DD for the day count
 * @returns {React.ReactElement} Reading room element
 */
const ReadingRoom = memo(function ReadingRoom({ room, onPickReading, today }) {
  const book = room.book;
  const days = book && book.startedAt ? SL.daysBetween(book.startedAt, today) : 0;
  const handleClick = useCallback((event) => {
    if (!isRealTap(event)) return;                         // ignore the touch that ends a swipe
    onPickReading(book, event.currentTarget);
  }, [book, onPickReading]);
  return html`<div className="reading case" data-theme="mahogany">
    <div className="reading-label">Currently Reading</div>
    <div className="scene">
      <div className="stand-glow" />
      <div className="stand-anchor" style=${{ top: STAND_TOP_Y }}>
        <${MarbleStand} book=${book} W=${READING_BOOK_W} H=${READING_BOOK_H} D=${READING_BOOK_D} onBookClick=${handleClick} />
      </div>
    </div>
    ${book ? html`<div className="reading-info">
      <div className="reading-title">${book.title}</div>
      <div className="reading-author">${book.author}</div>
      <div className="reading-meta">Day ${days + 1} · started ${SL.formatShortDate(book.startedAt)}${book.series ? ' · ' + SL.seriesLabel(book) : ''}</div>
    </div>` : html`<div className="reading-empty">The stand is empty. Pull something from your To Be Read shelf.</div>`}
  </div>`;});

/**
 * bookStage.js
 * The overlay where a book is pulled out and opened. The book is a real CSS 3D
 * box (cover, spine, page edges, back) animated with the Web Animations API:
 *   shelf spine -> (one smooth motion) -> turned to show the cover -> cover swings open.
 * The rest of the screen fades at the same time. Closing shuts the cover, then slides
 * the book back to the spine's slot in one smooth motion.
 */

// ----------------------------------------------------------------- constants
const STAGE_ANCHOR_Y = 0.46;                              // vertical anchor of the stage, as a fraction of screen height
const BOOK_MIN_W = 150;                                   // smallest book width on the stage (px)
const BOOK_MAX_W = 240;                                   // largest book width on the stage (px)
const BOOK_ASPECT = 1.5;                                  // book height / width
const PULL_DEPTH_PX = 90;                                 // how far the book swings toward you on the way out
const DISPLAY_TILT_Y = 22;                                // turn that keeps a little spine visible beside the cover
const DISPLAY_TILT_X = -4;
const PULL_OUT_MS = 520;                                  // slot -> display pose
const OPEN_MS = 560;                                      // cover swing and recentering
const COVER_CLOSE_MS = 240;                               // closing the cover before the book moves
const COVER_CLOSE_OVERLAP = 0.7;                          // the book starts moving when the cover is this far through closing
const PUT_BACK_MS = 380;                                  // display (or open) pose -> slot
const HINT_OPEN = 'Tap the cover to open';
const HINT_CLOSE = 'Tap outside to put it back';
const COVER_CLOSED = 'rotateY(0deg)';
const COVER_OPEN = 'rotateY(-180deg)';
const LIFT_FLAT = 'translateZ(0px)';

/**
 * The three resting poses of the book on the stage.
 * @param {Object} geo - {launch, W, anchorX, anchorY, scale0, openScale, displayScale}
 * @returns {{launch: Object, display: Object, open: Object}} Poses for poseTransform()
 */
function buildPoses(geo) {
  const { launch, W, anchorX, anchorY, scale0, openScale, displayScale } = geo;
  return {
    launch: { x: launch.rect.cx - anchorX, y: launch.rect.cy - anchorY, scale: scale0, rotateX: launch.rotateX, rotateY: launch.rotateY },
    display: { x: 0, y: 0, scale: displayScale, rotateX: DISPLAY_TILT_X, rotateY: DISPLAY_TILT_Y },
    open: { x: (openScale * W) / 2, y: 0, scale: openScale, rotateX: 0, rotateY: 0 },
  };
}

/**
 * Full-screen stage that shows one book coming off the shelf and opening.
 * All movement is played with the Web Animations API (see stageMotion.js), so it keeps
 * running smoothly even if the page is busy.
 * @param {{book: Object, allBooks: Object[], today: string, launch: Object, vp: {w: number, h: number}, onReturning: function, onClose: function}} props
 *   launch describes where the book starts: {kind: 'shelf'|'stand', rect: {cx, cy, w, h}, thicknessPx, rotateX, rotateY, ...};
 *   onReturning runs when the put-back motion starts (the stand shows its book again); onClose runs once the book is back in place
 * @returns {React.ReactElement} Stage overlay
 */
function BookStage({ book, allBooks, today, launch, vp, onReturning, onClose }) {
  const isShelf = launch.kind === 'shelf';
  const [hint, setHint] = useState('');
  const [pagesReady, setPagesReady] = useState(false);    // the printed pages mount after the pull-out, so they cost nothing during it
  const phaseRef = useRef('launching');                   // launching | display | opening | open | closing
  const poseRef = useRef(null);                           // moves, scales and turns the whole book
  const liftRef = useRef(null);                           // swings the book toward you and back
  const hingeRef = useRef(null);                          // swings the front cover
  const dimRef = useRef(null);

  // Book size on the stage, depth from the real spine width, and the display scales
  const W = SL.clamp((vp.w - 24) / 2, BOOK_MIN_W, BOOK_MAX_W);
  const H = Math.round(W * BOOK_ASPECT);
  // Size at the start: a spine is as tall as the book; from the stand, match the book's real on-screen scale
  const scale0 = isShelf ? launch.rect.h / H : (launch.designScale * launch.designW) / W;
  const D = Math.max(16, launch.thicknessPx / scale0);
  const displayScale = Math.min(1.45, (vp.w - 48) / (W + D * 0.5), (vp.h * 0.6) / H);
  const openScale = Math.min(1.25, (vp.w - 16) / (2 * W), (vp.h * 0.8) / H);
  const poses = useMemo(() => buildPoses({ launch, W, anchorX: vp.w / 2, anchorY: vp.h * STAGE_ANCHOR_Y, scale0, openScale, displayScale }),
    [launch, W, vp.w, vp.h, scale0, openScale, displayScale]);
  const launchT = poseTransform(poses.launch);
  const displayT = poseTransform(poses.display);
  const openT = poseTransform(poses.open);

  // Pull the book out as soon as the stage exists
  useLayoutEffect(() => {
    const dim = dimRef.current;
    requestAnimationFrame(() => dim.classList.add('is-on'));
    const hump = [   // out toward you and back: slows to a stop at the peak, so there is no kink
      { transform: LIFT_FLAT, easing: 'cubic-bezier(0.3, 0, 0.5, 1)' },
      { transform: `translateZ(${PULL_DEPTH_PX}px)`, offset: 0.4, easing: 'cubic-bezier(0.5, 0, 0.7, 1)' },
      { transform: LIFT_FLAT },
    ];
    poseRef.current.style.transform = launchT;            // in place before the first paint
    Promise.all([
      playMotion(poseRef.current, [{ transform: launchT }, { transform: displayT }], { duration: PULL_OUT_MS, easing: EASE_OUT }),
      playMotion(liftRef.current, hump, { duration: PULL_OUT_MS, easing: 'linear' }),
    ]).then(([moved]) => {
      if (!moved || phaseRef.current !== 'launching') return;   // interrupted by an early close
      phaseRef.current = 'display';
      setPagesReady(true);
      setHint(HINT_OPEN);
    });
    return () => { settleMotion(poseRef.current); settleMotion(liftRef.current); settleMotion(hingeRef.current); };
  }, []);

  /** Slides the book back into its slot and ends the stage. */
  const moveBack = (knownFrom) => {
    dimRef.current.classList.remove('is-on');
    if (!isShelf) onReturning();                          // the stand's book fades back in underneath
    playMotionTo(liftRef.current, { transform: LIFT_FLAT }, { duration: PUT_BACK_MS, easing: EASE_IN_OUT });
    playMotionTo(poseRef.current, { transform: launchT }, { duration: PUT_BACK_MS, easing: EASE_IN_OUT, from: knownFrom })
      .then((finished) => { if (finished) onClose(); });
  };

  /** Puts the book back: shuts the cover first if it is open, then slides the book home in one smooth motion. */
  const requestClose = () => {
    const was = phaseRef.current;
    if (was === 'closing') return;
    phaseRef.current = 'closing';
    setHint('');
    if (was === 'open' || was === 'opening') {
      const atRest = was === 'open';
      playMotionTo(hingeRef.current, { transform: COVER_CLOSED }, { duration: COVER_CLOSE_MS, easing: EASE_IN_OUT, from: atRest ? { transform: COVER_OPEN } : undefined });
      // The book starts moving just before the cover lands, so there is no dead pause between the two
      setTimeout(() => moveBack(atRest ? { transform: openT } : undefined), COVER_CLOSE_MS * COVER_CLOSE_OVERLAP);
    } else {
      moveBack(was === 'display' ? { transform: displayT } : undefined);
    }
  };

  /** Opens the cover and recenters the book so both pages are in view. */
  const openCover = (event) => {
    event.stopPropagation();
    if (phaseRef.current !== 'display') return;
    phaseRef.current = 'opening';
    setHint('');
    Promise.all([
      playMotion(hingeRef.current, [{ transform: COVER_CLOSED }, { transform: COVER_OPEN }], { duration: OPEN_MS, easing: EASE_OPEN }),
      playMotion(poseRef.current, [{ transform: displayT }, { transform: openT }], { duration: OPEN_MS, easing: EASE_OPEN }),
    ]).then(([swung]) => {
      if (swung && phaseRef.current === 'opening') { phaseRef.current = 'open'; setHint(HINT_CLOSE); }
    });
  };

  return html`<div className="stage" onClick=${requestClose}>
    <div className="stage-dim" ref=${dimRef} />
    <button className="stage-close" aria-label="Put the book back" onClick=${(e) => { e.stopPropagation(); requestClose(); }}>×</button>
    <div className="stage-anchor" onClick=${(e) => e.stopPropagation()}>
      <div className="book3d" ref=${poseRef} style=${{ left: -W / 2, top: -H / 2, width: W, height: H }}>
        <div className="book-lift" ref=${liftRef}>
          <${BookBox} book=${book} allBooks=${allBooks} today=${today} W=${W} H=${H} D=${D} spineUnit=${isShelf ? 1 / scale0 : undefined}
            hingeRef=${hingeRef} onCoverClick=${openCover} withPages=${pagesReady} />
        </div>
      </div>
    </div>
    <div className="stage-hint">${hint}</div>
  </div>`;
}

/**
 * app.js
 * The app shell: the horizontal swipe track of bookcases (To Be Read, Currently
 * Reading, genres, Youth, Did Not Finish), the page dots, and opening a book.
 */

// ----------------------------------------------------------------- constants
const FRAME_W = 360;                                      // logical width of every screen (a bookcase is 360px wide)
const FRAME_H = 700;                                      // logical height of every screen
const FRAME_SIDE_GUTTER = 16;                             // minimum space left and right of a screen
const PAGER_HEIGHT = 58;                                  // room kept at the bottom for the page dots
const MAX_FRAME_SCALE = 1.3;                              // do not blow screens up beyond this on large displays
const SNAP_SPRING = { type: 'spring', stiffness: 260, damping: 34 };
const SWIPE_DISTANCE_FRACTION = 0.1;                      // dragging this fraction of the screen width changes screens
const SWIPE_MIN_DISTANCE_PX = 28;                         // ...but never less than this many pixels
const SWIPE_MAX_DISTANCE_PX = 56;                         // ...and never more than this, on wide screens
const SWIPE_FLICK_VELOCITY = 180;                         // a quicker flick (px/s) changes screens whatever the distance
const DRAG_GUARD_RESET_MS = 90;                           // taps right after a swipe are ignored for this long
const HINT_VISIBLE_MS = 6000;                             // the swipe hint fades after this long

/**
 * Tracks the window size so layouts can rescale on rotation or resize.
 * @returns {{w: number, h: number}} Window width and height in px
 */
function useViewport() {
  const [vp, setVp] = useState({ w: window.innerWidth, h: window.innerHeight });
  useEffect(() => {
    const onResize = () => setVp({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return vp;
}

/**
 * One screen of the track: scales the 360px-wide design to fit the window.
 * @param {{vp: {w: number, h: number}, children: *}} props - Window size and the screen content
 * @returns {React.ReactElement} Scaled, centered frame
 */
function ScreenFrame({ vp, children }) {
  const scale = Math.min((vp.w - FRAME_SIDE_GUTTER * 2) / FRAME_W, (vp.h - PAGER_HEIGHT - 8) / FRAME_H, MAX_FRAME_SCALE);
  const top = Math.max(4, (vp.h - PAGER_HEIGHT - FRAME_H * scale) / 2);   // center vertically in the space above the dots
  return html`<div className="frame" style=${{ width: FRAME_W, marginLeft: -FRAME_W / 2, top, transform: `scale(${scale})` }}>${children}</div>`;
}

/**
 * Horizontal swipe track. Dragging snaps to whole screens; dots can jump.
 * @param {{count: number, index: number, onIndex: function, vp: Object, renderScreen: function}} props
 *   renderScreen(i) returns the content of screen i; only screens near the current one are drawn
 * @returns {React.ReactElement} Track element
 */
function SwipeTrack({ count, index, onIndex, vp, renderScreen }) {
  const x = useMotionValue(-index * vp.w);

  // Animate to the current screen whenever the index changes; jump (no animation) when the window resizes
  const lastWidth = useRef(vp.w);
  useEffect(() => {
    if (lastWidth.current !== vp.w) { lastWidth.current = vp.w; x.set(-index * vp.w); return; }
    const controls = animate(x, -index * vp.w, SNAP_SPRING);
    return () => controls.stop();
  }, [index, vp.w]);

  /** After a drag: a short drag or a quick flick moves one screen; otherwise it springs back. */
  const onDragEnd = (event, info) => {
    const needed = SL.clamp(vp.w * SWIPE_DISTANCE_FRACTION, SWIPE_MIN_DISTANCE_PX, SWIPE_MAX_DISTANCE_PX);
    let direction = 0;                                    // +1 next screen, -1 previous
    if (info.offset.x < -needed || info.velocity.x < -SWIPE_FLICK_VELOCITY) direction = 1;
    else if (info.offset.x > needed || info.velocity.x > SWIPE_FLICK_VELOCITY) direction = -1;
    const target = SL.clamp(index + direction, 0, count - 1);
    if (target === index) animate(x, -index * vp.w, SNAP_SPRING);   // the index did not change, so snap back by hand
    onIndex(target);
    setTimeout(() => { DragGuard.dragging = false; }, DRAG_GUARD_RESET_MS);
  };

  return html`<${motion.div} className="track" style=${{ x, width: count * vp.w }} drag="x" dragDirectionLock dragElastic=${0.12}
    dragConstraints=${{ left: -(count - 1) * vp.w, right: 0 }} dragMomentum=${false}
    onDragStart=${() => { DragGuard.dragging = true; }} onDragEnd=${onDragEnd}>
    ${Array.from({ length: count }, (_, i) => html`<div className="slot" key=${i} style=${{ width: vp.w }}>
      ${Math.abs(i - index) <= 1 ? renderScreen(i) : null}</div>`)}
  <//>`;
}

/**
 * Dots along the bottom; tap one to jump to that screen.
 * @param {{rooms: Object[], index: number, onIndex: function, showHint: boolean}} props - Screens, current index, jump handler, hint visibility
 * @returns {React.ReactElement} Pager element
 */
function Pager({ rooms, index, onIndex, showHint }) {
  return html`<div className="pager">
    <div className=${'hint' + (showHint ? '' : ' is-hidden')}>Swipe between bookcases</div>
    <div className="pips">${rooms.map((room, i) => html`<button key=${room.id} className=${'pip' + (room.kind === 'reading' ? ' is-reading' : '')}
      aria-label=${room.title} aria-current=${i === index} onClick=${() => onIndex(i)} />`)}</div>
  </div>`;
}

/**
 * Describes where a tapped element is on screen so the stage can start the book there.
 * @param {string} kind - 'shelf' or 'stand'
 * @param {Element} element - The tapped spine or cover
 * @param {Object} extras - {rotateX, rotateY, thicknessPx} for this kind of launch
 * @returns {{kind: string, rect: {cx: number, cy: number, w: number, h: number}, rotateX: number, rotateY: number, thicknessPx: number}}
 */
function launchFromElement(kind, element, extras) {
  const box = element.getBoundingClientRect();
  return { kind, rect: { cx: box.left + box.width / 2, cy: box.top + box.height / 2, w: box.width, h: box.height }, ...extras };
}

/**
 * Hides or shows the spine or stand book that is currently on the stage. Done on the element
 * directly so the screens do not re-render (a re-render at that moment would stutter the pull-out).
 * @param {string} bookId - Book id
 * @param {boolean} hidden - True to hide, false to show
 */
function setSceneBookHidden(bookId, hidden) {
  document.querySelectorAll(`[data-book-id="${bookId}"]`).forEach((element) => element.classList.toggle('is-out', hidden));
}

/**
 * The whole prototype.
 * @returns {React.ReactElement} App element
 */
function App() {
  const vp = useViewport();
  const today = useMemo(() => SL.todayIso(), []);
  const books = useMemo(() => FakeData.buildFakeLibrary(today), [today]);
  const [sortModes, setSortModes] = useState({});         // sort mode per group key
  const rooms = useMemo(() => SL.buildRooms(books, { sortModes }), [books, sortModes]);
  const readingAt = rooms.findIndex((r) => r.kind === 'reading');
  const [index, setIndex] = useState(readingAt);           // start on Currently Reading
  const [picked, setPicked] = useState(null);              // {book, launch} while the stage is open
  const [showHint, setShowHint] = useState(true);
  const safeIndex = SL.clamp(index, 0, rooms.length - 1);

  useEffect(() => { const id = setTimeout(() => setShowHint(false), HINT_VISIBLE_MS); return () => clearTimeout(id); }, []);

  const cycleSort = useCallback((groupKey) => setSortModes((current) => ({ ...current, [groupKey]: SL.nextSortMode(current[groupKey] || 'library') })), []);
  const pickFromShelf = useCallback((book, element) => {
    const launch = launchFromElement('shelf', element, { rotateX: 0, rotateY: 90, thicknessPx: element.getBoundingClientRect().width });
    setSceneBookHidden(book.id, true);
    setPicked({ book, launch });
  }, []);
  const pickReading = useCallback((book, element) => {
    const box = element.getBoundingClientRect();
    const turn = Math.cos((STAND_TURN_Y_DEG * Math.PI) / 180);
    const onScreenScale = box.width / (READING_BOOK_W * turn);   // how big the book is on screen compared with its design size
    setSceneBookHidden(book.id, true);
    setPicked({ book, launch: launchFromElement('stand', element, {
      rotateX: BOOK_REST_DEG + STAND_TILT_X_DEG, rotateY: STAND_TURN_Y_DEG, thicknessPx: READING_BOOK_D * onScreenScale,
      designScale: onScreenScale, designW: READING_BOOK_W }) });
  }, []);
  const seriesStyles = useMemo(() => SL.buildSeriesStyles(books), [books]);

  /** Draws screen i: the reading room or a bookcase. */
  const renderScreen = (i) => {
    const room = rooms[i];
    const content = room.kind === 'reading'
      ? html`<${ReadingRoom} room=${room} onPickReading=${pickReading} today=${today} />`
      : html`<${Bookcase} room=${room} onPick=${pickFromShelf} onCycleSort=${cycleSort} />`;
    return html`<${ScreenFrame} vp=${vp}>${content}<//>`;
  };

  return html`<${MotionConfig} reducedMotion="user"><${SeriesStyleContext.Provider} value=${seriesStyles}><div id="app-inner" style=${{ height: '100%' }}>
    <${SwipeTrack} count=${rooms.length} index=${safeIndex} onIndex=${setIndex} vp=${vp} renderScreen=${renderScreen} />
    <${Pager} rooms=${rooms} index=${safeIndex} onIndex=${setIndex} showHint=${showHint} />
    ${picked && html`<${BookStage} key=${picked.book.id} book=${picked.book} allBooks=${books} today=${today} launch=${picked.launch} vp=${vp}
      onReturning=${() => setSceneBookHidden(picked.book.id, false)} onClose=${() => { setSceneBookHidden(picked.book.id, false); setPicked(null); }} />`}
  </div><//><//>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);

</script>
